app-id: com.promptpetal.PromptPetal
runtime: org.gnome.Platform
runtime-version: '48'  # GNOME: carries WebKitGTK 4.1 for the AI sign in windows
sdk: org.gnome.Sdk
command: prompt-petal
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The keyring, for saved AI keys and the sync recovery code.
  - --talk-name=org.freedesktop.secrets
  # The tray icon and notifications.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: prompt-petal
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib /app/bin
      - cp -a prompt-petal /app/lib/prompt-petal
      - ln -s "/app/lib/prompt-petal/bin/Prompt Petal" /app/bin/prompt-petal
      - install -Dm644 com.promptpetal.PromptPetal.desktop /app/share/applications/com.promptpetal.PromptPetal.desktop
      - install -Dm644 com.promptpetal.PromptPetal.metainfo.xml /app/share/metainfo/com.promptpetal.PromptPetal.metainfo.xml
      - install -Dm644 "prompt-petal/lib/Prompt Petal.png" /app/share/icons/hicolor/512x512/apps/com.promptpetal.PromptPetal.png
    sources:
      - type: archive
        url: https://promptpetal.com/downloads/Prompt-Petal-1.4.0-45-linux-x86_64.tar.gz
        sha256: bd47a2c9cbeb1b5a675f64914c8724bf577d87f4a7f408ed04de7854120f6162
        dest: prompt-petal
      - type: file
        path: com.promptpetal.PromptPetal.desktop
      - type: file
        path: com.promptpetal.PromptPetal.metainfo.xml
